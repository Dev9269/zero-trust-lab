name: Deploy to server

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/ztlab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "--- Pulling latest code ---"
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
              cd "${{ env.DEPLOY_PATH }}"
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git "${{ env.DEPLOY_PATH }}"
              cd "${{ env.DEPLOY_PATH }}"
            fi

            echo "--- Building and restarting services ---"
            cd gateway
            docker compose pull || true
            docker compose build
            docker compose up -d --remove-orphans

            echo "--- Smoke test: checking gateway health endpoint ---"
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://localhost/healthz 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Smoke test PASSED (HTTP $STATUS)"
                break
              fi
              echo "Retry $i/5 — gateway returned $STATUS, waiting..."
              sleep 3
            done
            if [ "$STATUS" != "200" ]; then
              echo "Smoke test FAILED after 5 retries"
              docker compose logs --tail=20
              exit 1
            fi

            echo "--- Smoke test: POSTURE_SIGNING_SECRET is set ---"
            docker compose exec -T authz-bridge sh -c 'echo "POSTURE_SIGNING_SECRET=${POSTURE_SIGNING_SECRET:+set}"'

            echo "--- Cleaning up dangling images ---"
            docker image prune -f

            echo "--- Deployment complete ---"
            docker compose ps

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "Deployment succeeded"
          else
            echo "Deployment skipped or failed — configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets to enable"
          fi
