name: Feature Request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "## Feature Request"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you solve it?
  - type: dropdown
    id: pillar
    attributes:
      label: CISA Pillar
      options:
        - Identity
        - Devices
        - Networks
        - Applications
        - Data
