# Production override — pulls pre-built images from GHCR instead of
# building locally. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires: docker login ghcr.io (or set GHCR_TOKEN env var)
#
# IMAGE NAMESPACE: Published by the docker-publish.yml workflow under
# ${{ github.repository_owner }} (currently "dev9269"). If you fork this
# repo, update the image paths below OR use the Makefile's prod-up target
# which picks up the correct namespace automatically.

services:
  authz-bridge:
    image: ghcr.io/dev9269/ztlab-authz-bridge:latest
    build: null

  demo-app:
    image: ghcr.io/dev9269/ztlab-demo-app:latest
    build: null

  mock-oidc:
    image: ghcr.io/dev9269/ztlab-mock-oidc:latest
    build: null
